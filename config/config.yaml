workdir:
    WORKDIR
scriptsdir:
    PIPELINE_HOME/workflow/scripts/
manifest:
    WORKDIR/config/samples.tsv
tools:
    PIPELINE_HOME/resources/tools.yaml
cluster:
    WORKDIR/config/cluster.yaml

microcdir:
    /data/khanlab3/gb_omics/software/Micro-C/
pairixdir:
    /data/khanlab3/gb_omics/software/pairix/bin/

# Depth (shallow or deep)
depth: shallow

# Ploidy
ploidy: 2

# Reference genome
genome: hg38

hg38:
    ref:
        /data/khanlab3/gb_omics/resources/genomes/hg38/hg38_main.fa
    chrom_sizes:
        /data/khanlab3/gb_omics/resources/genomes/hg38/hg38_main.genome
    bwa_ref:
        /data/khanlab3/gb_omics/resources/genomes/hg38/hg38_main.fa
    exp_file_inter:
        /data/khanlab3/gb_omics/resources/hic/hic_breakfinder/inter_expect_1Mb.hg38.txt
    exp_file_intra:
        /data/khanlab3/gb_omics/resources/hic/hic_breakfinder/intra_expect_100kb.hg38.txt
