# Cluster resources per rule
__default__:
    gres: lscratch:500
    mem: 4g
    threads: 2
    time: 00-08:00:00
    partition: norm
    name: "{rule}.{wildcards}"
    output: "logs/{rule}.${{SLURM_JOBID}}.%j.{wildcards}.out"
    error: "logs/{rule}.${{SLURM_JOBID}}.%j.{wildcards}.err"

align:
    threads: 32
    mem: 24g

generate_pairs:
    threads: 4
    mem: 4g
    time: 1-00:00:00

merge_pairs:
    threads: 8
    mem: 120g
    time: 00-00:30:00

contact_matrix_hic:
    threads: 16
    mem: 120g
    time: 1-00:00:00
