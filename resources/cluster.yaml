# Cluster resources per rule
__default__:
    gres: lscratch:500
    mem: 4g
    threads: 2
    time: 00-04:00:00
    partition: norm
    name: "{rule}.{wildcards}"
    output: "logs/{rule}.${{SLURM_JOBID}}.%j.{wildcards}.out"
    error: "logs/{rule}.${{SLURM_JOBID}}.%j.{wildcards}.err"

align:
    threads: 32
    mem: 24g

generate_pairs:
    threads: 4
    mem: 4g
    time: 00-8:00:00

contact_matrix_hic:
    threads: 8
    mem: 48g
    time: 00-8:00:00
