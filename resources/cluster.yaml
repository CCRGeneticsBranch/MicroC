# Cluster resources per rule
__default__:
    gres: lscratch:500
    mem: 4g
    threads: 2
    time: 00-08:00:00
    partition: norm
    name: "{rule}.{wildcards}"
    output: "logs/{rule}.${{SLURM_JOBID}}.%j.{wildcards}.out"
    error: "logs/{rule}.${{SLURM_JOBID}}.%j.{wildcards}.err"

# Preprocessing
align:
    threads: 32
    mem: 24g

generate_pairs:
    threads: 4
    mem: 4g
    time: 1-00:00:00

merge_pairs:
    threads: 8
    mem: 120g
    time: 30:00

contact_matrix_hic:
    threads: 16
    mem: 96g

contact_matrix_cooler:
    threads: 32
    mem: 48g

# Topology
convert_hic_h5:
    time: 1:00:00

call_compartment_fanc:
    mem: 8g         
    time: 1:00:00   
    
call_tads_arrowhead:
    mem: 96g
    threads: 16
    time: 1:00:00
    
call_tads_hic:
    threads: 24
    mem: 48g
    time: 1:00:00

call_loops_mustache:
    threads: 24
    mem: 24g
    time: 1:00:00

call_loops_hic:
    threads: 48
    mem: 120g
    time: 1-00:00:00

# Differential loops
call_diff_tads:
    threads: 12
    mem: 96g
    time: 1-00:00:00

# SVs
eaglec:
    mem: 24g
    threads: 4
    time: 2-00:00:00

call_cnv_neoloop:
    time: 1:00:00

assemble_sv:
    threads: 8
    mem: 96g
    time: 1:00:00

call_neoloop:
    threads: 8
    mem: 24g
    time: 1:00:00

call_neotad:
    time: 1:00:00
