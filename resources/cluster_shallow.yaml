# Cluster resources per rule
__default__:
    gres: lscratch:200
    mem: 4g
    threads: 2
    time: 00-00:30:00
    partition: norm
    name: "{rule}.{wildcards}"
    output: "logs/{rule}.${{SLURM_JOBID}}.%j.{wildcards}.out"
    error: "logs/{rule}.${{SLURM_JOBID}}.%j.{wildcards}.err"

align:
    threads: 16
    mem: 12g

generate_pairs:
    threads: 4
    mem: 4g

merge_pairs:
    threads: 2
    mem: 2g

contact_matrix_hic:
    threads: 8
    mem: 16g
    time: 00-01:00:00